[Main]
Enabled=1           // Turns the mod on. (0 = False, 1 = True (Default))
HotReload=0         // Reads this file again every second while the game runs. (0 = False (Default), 1 = True)
SurfaceNormals=1    // [REDUX only] The gloss follows the body's normals. (0 = False, 1 = True (Default))
BodySpecular=1      // [REDUX only, Compensate=0] The highlight follows the body's paint. (0 = False, 1 = True (Default))
Compensate=1        // [REDUX only] The highlight looks the same as with the game's own shader. (0 = False, 1 = True (Default))
Log=0               // Writes NFSMWHQDecals.log. (0 = False (Default), 1 = True)
LogParts=0          // Logs the part names, needs Log=1. (0 = False (Default), 1 = True)
Debug=0             // Tints the replaced draws magenta. (0 = False (Default), 1 = True)
DebugNormals=0      // [REDUX only] Shows the normals as colours. (0 = False (Default), 1 = True)

; Looks: take the ";" off the lines of the look you want and put ";" in front of the lines of the active one.
[NumberDecal]
Enabled=1           // Turns this group on. (0 = False, 1 = True (Default))

; ---- Original: a mild reflection and a soft highlight, like the wraps of NFS Heat (the default) ----
Strength=1          // 0 = the game's own decal, 1 = full effect
Specular=0.3        // strength of the highlight
Reflectivity=0.25   // amount of environment reflection
Metallic=0          // 0 = plain, 1 = the reflection takes the decal colour
IgnoreVertexMask=1  // 1 = ignore the decal's own highlight and reflection masks
EnergyConserving=0  // 1 = the reflection replaces part of the colour
MatchBody=0         // [REDUX only, Compensate=0] 1 = highlight power from the body's paint
Smoothness=1        // [REDUX only, Compensate=0] 0 = broad highlight, 1 = sharp
Fresnel=0           // [REDUX only, Compensate=0] 1 = reflection grows at grazing angles
HighlightMax=0.5    // highlight on the decal: 0 = none, a number = ceiling, Unlimited = no ceiling

; ---- Gloss: looks like the car body's own paint ----
;Strength=1
;Specular=1
;Reflectivity=0.5
;Metallic=0
;IgnoreVertexMask=1
;EnergyConserving=0
;MatchBody=1
;Smoothness=0.7
;Fresnel=0
;HighlightMax=0

; ---- Metallic: a bright, wide highlight and a stronger reflection, like the game's own metallic paint (METPAINT) ----
;Strength=1
;Specular=0.7
;Reflectivity=0.5
;Metallic=0
;IgnoreVertexMask=1
;EnergyConserving=0
;MatchBody=0
;Smoothness=0.6
;Fresnel=0
;HighlightMax=1

; ---- Chrome: a strong, mirror-like reflection; bright areas can clip to white ----
;Strength=1
;Specular=1
;Reflectivity=1.5
;Metallic=0.6
;IgnoreVertexMask=1
;EnergyConserving=0
;MatchBody=0
;Smoothness=1
;Fresnel=0.3
;HighlightMax=1

; ---- Matte: a broad, faint highlight and no reflection, close to the game's DULLPLASTIC material (approximate) ----
;Strength=1
;Specular=0
;Reflectivity=0
;Metallic=0
;IgnoreVertexMask=1
;EnergyConserving=0
;MatchBody=0
;Smoothness=0.32
;Fresnel=0
;HighlightMax=0.15

